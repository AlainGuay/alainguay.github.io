# Config commune. La barre de navigation vit dans les profils :
#   _quarto-en.yml  (défaut)  → pages anglaises à la racine
#   _quarto-fr.yml            → pages françaises sous fr/
# Rendu complet : quarto render && quarto render --profile fr

profile:
  default: en
  group:
    - [en, fr]

project:
  type: website
  output-dir: _site

website:
  title: "Alain Guay"
  description: "Alain Guay — Professor of Economics, Université du Québec à Montréal. Macroeconomics, econometrics, structural VARs, business cycles."
  site-url: "https://alainguay.github.io"
  # Décommenter une fois files/favicon.png déposé (32×32 px)
  # favicon: files/favicon.png
  page-footer:
    left: "Alain Guay — Université du Québec à Montréal"

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    css: []
    link-external-newwindow: true
    grid:
      body-width: 900px
